<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="../imgs/globe.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoGuesser — Adham Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../styles/stylesLanding.css">
  <!-- Spotify feature hidden for now — <link rel="stylesheet" href="../styles/spotify.css"> -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <!-- Spotify feature hidden for now — <script type="module" src="../scripts/spotify.js"></script> -->

  <!-- Google tag (gtag.js) — production analytics. Harmless on localhost. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DHZBWJCCDC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DHZBWJCCDC');
  </script>
</head>
<body>
  <div class="blurry-background"></div>

  <div id="top-right-container">
    <button id="loginStatus">Guest Mode</button>
    <button id="login-button">Logout</button>
  </div>

  <a id="hub-button" href="./hub.html">All Games</a>
  

  <div class="landing-page">
    <!-- Welcome Title -->
    <h1>Welcome to GeoGuesser!</h1>

    <!-- Game Mode Selection -->
    <div class="game-mode-selection">
      <h2>Select Game Mode</h2>
      <select id="game-mode">
        <option value="classic">Classic</option>
        <option value="countrySelect">Country Select</option>
      </select>

      <div id="country-select-container" style="display: none; margin-top: 10px;">
        <label for="country-select">Select a Country:</label>
        <select id="country-select"></select>
      </div>
      
      <h3>Game Control Options:</h3>

      <div class="options-container">
        <div>
          <label class="option">
            <input type="checkbox" id="moving" checked/>
            Moving
          </label>
        </div>
    
        <div>
          <label class="option">
            <input type="checkbox" id="zooming" checked/>
            Zooming
          </label>
        </div>
    
        <div>
          <label class="option">
            <input type="checkbox" id="timer"/>
            Timer
          </label>
          <div id="timer-dropdown-wrap">
            <select id="timerDropdown" class="timer-dropdown" style="display: none;">
              <option value="30">30 seconds</option>
              <option value="60">1 minute</option>
              <option value="90">1:30 minutes</option>
              <option value="120">2 minutes</option>
            </select>
          </div>
        </div>
      </div>
    
    <!-- Dropdown for number of rounds -->
    <div id="rounds-dropdown">
      <label for="rounds">Select Number of Rounds:</label>
      <select id="rounds">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="99999" selected>∞</option>
      </select>
    </div>

    <div class="cta-group">
      <h3>Play solo</h3>
      <button id="start-btn" class="btn btn--secondary">Play Solo</button>
    </div>

    <div class="cta-group">
      <h3>Play with friends</h3>
      <button id="join-btn" class="btn btn--primary">Create Lobby</button>
      <form id="join-room-form" class="join-inline">
        <input type="text" id="room-code-input" placeholder="Enter room code">
        <button id="join-room-button" type="submit" class="btn btn--secondary">Join Room</button>
      </form>
    </div>
  </div>

  <div class="kofi-footer-fixed">
    <a class="kofi-link" href="https://ko-fi.com/adham125" target="_blank" rel="noopener noreferrer" aria-label="Support GeoGuesser on Ko-fi">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <span>Support on Ko-fi</span>
    </a>
  </div>

  <aside id="kofi-card" class="kofi-card" hidden aria-label="Support the developer">
    <button class="kofi-card-close" id="kofi-card-close" aria-label="Dismiss">×</button>
    <svg class="kofi-popup-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <p class="kofi-card-body">Solo dev here — if you enjoy the games, a small tip keeps the servers running.</p>
    <a class="btn btn--accent btn--sm" id="kofi-card-cta" href="https://ko-fi.com/adham125" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
  </aside>

  <script type="module" src="../scripts/main.js"></script>
  <script>
(function () {
  const card = document.getElementById('kofi-card');
  const closeBtn = document.getElementById('kofi-card-close');
  const cta = document.getElementById('kofi-card-cta');
  if (!card) return;

  const COOLDOWN_DISMISS_DAYS = 7;
  const COOLDOWN_TIP_DAYS = 7;
  const SHOW_DELAY_MS = 30000; // appear 30s in, not 2.5s

  function getCookie(name) {
    return document.cookie.split('; ').find(r => r.startsWith(name + '='))?.split('=')[1];
  }
  function setCookie(name, value, days) {
    const d = new Date(); d.setTime(d.getTime() + days * 864e5);
    document.cookie = `${name}=${value}; expires=${d.toUTCString()}; path=/; SameSite=Lax`;
  }
  const nextAt = parseInt(getCookie('kofi_next') || '0', 10);
  if (Date.now() < nextAt) return; // still in cooldown

  const timer = setTimeout(() => {
    card.hidden = false;            // non-modal: no backdrop, no focus move
    card.classList.add('is-in');
  }, SHOW_DELAY_MS);

  function dismiss(days) {
    clearTimeout(timer);
    card.hidden = true;
    setCookie('kofi_next', String(Date.now() + days * 864e5), days);
  }
  closeBtn.addEventListener('click', () => dismiss(COOLDOWN_DISMISS_DAYS));
  cta.addEventListener('click', () => dismiss(COOLDOWN_TIP_DAYS));
})();
  </script>
</body>
</html>
