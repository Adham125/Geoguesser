<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Setup — GeoGuesser</title>
    <link rel="icon" href="../imgs/globe.png">
    <link rel="stylesheet" href="../styles/stylesLanding.css">
    <link rel="stylesheet" href="../styles/spotify.css">

    <!-- Google tag (gtag.js) — production analytics. Harmless on localhost. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DHZBWJCCDC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DHZBWJCCDC');
    </script>
    <style>
        /* Page-local: colour swatch input + error line. Everything else
           inherits from stylesLanding.css + tokens.css. */
        .pd-field {
            text-align: left;
            margin-bottom: var(--space-4);
        }
        .pd-field label {
            display: block;
            font-family: var(--font-heading);
            font-size: var(--font-size-xs);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--color-fg-muted);
            margin-bottom: var(--space-2);
        }
        .pd-color-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-2) var(--space-3);
            background: var(--color-surface-2);
            border: 1px solid var(--color-border-strong);
            border-radius: var(--radius-md);
        }
        .pd-color-label {
            flex: 1;
            font-family: var(--font-body);
            font-size: var(--font-size-base);
            color: var(--color-fg);
        }
        /* Circular colour swatch that shows the picked colour; the real
           input is transparent and overlaid so the click opens the picker. */
        .pd-swatch {
            position: relative;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }
        .pd-swatch-visible {
            display: block;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--color-surface);
            box-shadow: 0 0 0 1px var(--color-border-strong), var(--shadow-sm);
            background-color: #2563EB;
            pointer-events: none;
            position: relative;
            transition: transform var(--dur-fast) var(--ease-out),
                        box-shadow var(--dur-fast) var(--ease-out);
        }
        /* Small pencil icon in the corner to make "clickable" obvious. */
        .pd-swatch-visible::after {
            content: "";
            position: absolute;
            right: -4px;
            bottom: -4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--color-surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 20h9'/><path d='M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z'/></svg>") no-repeat center;
            background-size: 10px 10px;
            border: 1px solid var(--color-border-strong);
        }
        .pd-swatch:hover .pd-swatch-visible {
            transform: scale(1.05);
            box-shadow: 0 0 0 1px var(--color-primary), var(--shadow-md);
        }
        #color-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            border: none;
            padding: 0;
            margin: 0;
            z-index: 1;
        }
        #color-input:focus-visible + .pd-swatch-visible {
            outline: 3px solid var(--color-ring);
            outline-offset: 3px;
        }
        #error-message {
            color: var(--color-destructive);
            font-size: var(--font-size-sm);
            margin: var(--space-2) 0 var(--space-3);
            min-height: 1.2em;
        }
        #submit-button {
            width: 100%;
            margin-top: var(--space-2);
        }
        .pd-subtitle {
            font-family: var(--font-body);
            font-size: var(--font-size-sm);
            color: var(--color-fg-muted);
            margin: 0 0 var(--space-5);
        }
    </style>
</head>
<body>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script type="module" src="../scripts/pDetails.js"></script>
    <script type="module" src="../scripts/spotify.js"></script>
    <script src="../scripts/backButton.js" defer></script>

    <a href="./main.html" id="back-button">&lt; Back</a>
    <div class="blurry-background"></div>

    <div class="landing-page">
        <h1>Your Player</h1>
        <p class="pd-subtitle">Pick a name and marker colour before joining a room.</p>

        <div class="pd-field">
            <label for="name">Username</label>
            <input autocomplete="username" type="text" id="name" name="name" placeholder="e.g. Alex" required>
        </div>

        <div class="pd-field">
            <label for="color-input">Marker colour</label>
            <div class="pd-color-row">
                <span class="pd-color-label">Tap the swatch to change</span>
                <span class="pd-swatch">
                    <input type="color" id="color-input" name="color" value="#2563EB" aria-label="Marker colour">
                    <span class="pd-swatch-visible" id="pd-swatch-visible" aria-hidden="true"></span>
                </span>
            </div>
        </div>

        <div id="error-message" role="alert" aria-live="polite"></div>

        <button id="submit-button">Enter Game</button>
    </div>

    <script>
      // Mirror the live colour onto the visible swatch (the <input type=color>
      // is transparent & overlaid so we draw the swatch ourselves).
      (function () {
        const input = document.getElementById('color-input');
        const swatch = document.getElementById('pd-swatch-visible');
        if (!input || !swatch) return;
        const sync = () => { swatch.style.backgroundColor = input.value; };
        input.addEventListener('input', sync);
        input.addEventListener('change', sync);
        sync();
      })();
    </script>

    <div class="kofi-footer-fixed">
      <a class="kofi-link" href="https://ko-fi.com/adham125" target="_blank" rel="noopener noreferrer" aria-label="Support GeoGuesser on Ko-fi">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span>Support on Ko-fi</span>
      </a>
    </div>
</body>
</html>
