<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing — GeoGuesser</title>
    <link rel="icon" href="../imgs/globe.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" type="text/css" href="../styles/style.css" />
    <link rel="stylesheet" href="../styles/spotify.css">
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script type="module" src="../scripts/game.js"></script>
    <script type="module" src="../scripts/spotify.js"></script>
    <script src="../scripts/backButton.js" defer></script>

    <!-- Google tag (gtag.js) — production analytics. Harmless on localhost. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DHZBWJCCDC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DHZBWJCCDC');
    </script>
  </head>
  <body>
    <a href="./lobby.html" id="back-button" data-sp-fallback="./main.html">&lt; Back</a>
    <div id="map"></div>
    <div id="pano">
      <div class="loading-spinner" id="loading-spinner"></div>
    </div>
    <div class="timer-container">
      <div id="timer" class="timer">00:00</div>
    </div>
    <div id="round-indicator" class="round-indicator" aria-live="polite"></div>

    <div id="floating-panel">
      <button id="Confirm" class="actionButton">Confirm</button>
      <button id="Next" class="actionButton">Next</button>
      <button id="Start_Location" class="actionButton">Start Location</button>
      <button id="EndGame" class="actionButton" style="display:none;">End Game</button>
    </div>
    <div id="compass">
      <img id="compass-image" src="../imgs/compass-icon.png" alt="Compass" />
    </div>

    <div id="scoresMenu" class="scores-menu hidden">
      <h2>Final Scores</h2>
      <div id="scoresWinner" class="scores-winner"></div>
      <div id="scoresList">
        <!-- The table for scores will be dynamically inserted here -->
      </div>
      <div class="button-group">
        <a href="./lobby.html" id="replayButton" class="actionButton" style="display:none;">Play Again</a>
        <button id="closeButton" class="actionButton">Close</button>
        <a href="./main.html" id="homeButton" class="actionButton">Home</a>
      </div>
      <div class="kofi-footer">
        <a class="kofi-link" href="https://ko-fi.com/adham125" target="_blank" rel="noopener noreferrer" aria-label="Tip the developer on Ko-fi">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span>Enjoyed the game? Tip the dev on Ko-fi</span>
        </a>
      </div>
    </div>

    <div id="roundResult" class="round-result hidden">
      <div class="round-result-header">Round result</div>
      <div id="round-result-score" class="round-result-score">0 pts</div>
      <div id="round-result-distance" class="round-result-distance"></div>
      <div id="round-result-country" class="round-result-country"></div>
      <a id="round-result-plonkit" class="round-result-plonkit" target="_blank" rel="noopener" style="display:none;"></a>
    </div>
    <div id="score-tracker">
      <div id="player-scores">
          </div>
    </div>
  </body>
</html>
