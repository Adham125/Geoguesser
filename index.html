<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./imgs/globe.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Adham Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="./styles/stylesLanding.css">
  <!-- Spotify feature hidden for now — <link rel="stylesheet" href="./styles/spotify.css"> -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <!-- Spotify feature hidden for now — <script type="module" src="./scripts/spotify.js"></script> -->

  <!-- Google tag (gtag.js) — production analytics. Harmless on localhost. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DHZBWJCCDC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DHZBWJCCDC');
  </script>
</head>
<body>
  <div id="top-right-container">
    <button id="loginStatus">Guest Mode</button>
  </div>
  <div class="blurry-background"></div>
  <div class="landing-page">
    <!-- Welcome Title -->
    <h1>Welcome to Adham Games!</h1>
    <h2>Login / Sign up</h2>

    <form id="auth-form">
      <div>
          <input autocomplete="email" type="email" id="username-input" placeholder="Enter Email">
          <input autocomplete="current-password" type="password" id="password-input" placeholder="Enter Password">
      </div>
      <!-- Join Buttons -->
      <div class="start-button">
        <button id="login" type="submit" class="btn btn--primary">Login</button>
      </div>

      <div id="signUp-container" class="start-button">
        <button id="signUp-button" type="button" class="btn btn--secondary">Sign Up</button>
      </div>
    </form>

    <button id="forgot-link" type="button" class="link-btn">Forgot password?</button>

    <form id="forgot-step1" style="display:none">
      <div>
        <input autocomplete="email" type="email" id="forgot-email" placeholder="Enter Email">
      </div>
      <div class="start-button">
        <button id="send-code" type="submit" class="btn btn--primary">Send code</button>
      </div>
      <button type="button" class="link-btn back-to-login">Back to login</button>
    </form>

    <form id="forgot-step2" style="display:none">
      <div>
        <input type="text" id="reset-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code">
        <input type="password" id="new-password" autocomplete="new-password" placeholder="New password">
      </div>
      <div class="start-button">
        <button id="do-reset" type="submit" class="btn btn--primary">Reset password</button>
      </div>
      <button type="button" class="link-btn back-to-login">Back to login</button>
    </form>

  </div>
  <script type="module" src="./scripts/login.js"></script>
</body>
</html>
