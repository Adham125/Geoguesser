<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="../imgs/globe.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby — GeoGuesser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../styles/stylesLanding.css">
  <link rel="stylesheet" type="text/css" href="../styles/style.css" />
  <link rel="stylesheet" href="../styles/spotify.css">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script type="module" src="../scripts/lobby.js"></script>
  <script type="module" src="../scripts/spotify.js"></script>
  <script src="../scripts/backButton.js" defer></script>

  <!-- Google tag (gtag.js) — production analytics. Harmless on localhost. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DHZBWJCCDC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DHZBWJCCDC');
  </script>
</head>
<body>
  <a href="./main.html" id="back-button">&lt; Back</a>
  <div class="blurry-background"></div>
  <div id="player-list">
    <h2>Players in Room</h2>
    <ul id="players-ul">
        </ul>
  </div>

  <div class="landing-page">
    <h1>Private Room</h1>

    <h2 id="roomCode"></h2>

    <!-- Game Mode Selection -->
    <div class="game-mode-selection">
      <h2>Select Game Mode</h2>
      <select id="game-mode">
        <option value="classic">Classic</option>
        <option value="countrySelect">Country Select</option>
        <option value="hideAndSeek">Hide And Seek</option>
      </select>

      <div id="country-select-container" style="display: none; margin-top: 10px;">
        <label for="country-select">Select a Country:</label>
        <select id="country-select"></select>
      </div>
      
      <h3>Game Control Options:</h3>

      <div class="options-container">
        <div>
          <label class="option">
            <input type="checkbox" id="moving" checked/>
            Moving
          </label>
        </div>
    
        <div>
          <label class="option">
            <input type="checkbox" id="zooming" checked/>
            Zooming
          </label>
        </div>
    
        <div>
          <label class="option">
            <input type="checkbox" id="timer"/>
            Timer
          </label>
          <div id="timer">
            <select id="timerDropdown" class="timer-dropdown" style="display: none;">
              <option value="30">30 seconds</option>
              <option value="60">1 minute</option>
              <option value="90">1:30 minutes</option>
              <option value="120">2 minutes</option>
            </select>
          </div>
        </div>
      </div>

    <!-- Dropdown for number of rounds -->
    <div id="rounds-dropdown">
      <label for="rounds">Select Number of Rounds:</label>
      <select id="rounds">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="99999" selected>∞</option>
      </select>
    </div>

    <!-- Hide & Seek-specific settings (hidden unless H&S is the selected mode). -->
    <div id="hs-settings" style="display: none;">
      <h3>Hide &amp; Seek Options:</h3>
      <div class="options-container">
        <div>
          <label class="option">
            <input type="checkbox" id="hsAllowPhotospheres"/>
            Allow photospheres as hiding spots
          </label>
        </div>
      </div>
    </div>

    <button class="actionButton" id="start-btn">Start Game</button>
  </div>

  <div class="kofi-footer-fixed">
    <a class="kofi-link" href="https://ko-fi.com/adham125" target="_blank" rel="noopener noreferrer" aria-label="Support GeoGuesser on Ko-fi">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <span>Support on Ko-fi</span>
    </a>
  </div>
</body>
</html>
