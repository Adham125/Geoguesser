<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../imgs/globe.png">
  <title>Connecting Spotify…</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <style>
    /* Minimal — this page is a transient redirect, not a destination. */
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-body);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      box-sizing: border-box;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      max-width: 420px;
      width: 100%;
      padding: var(--space-8) var(--space-6);
      text-align: center;
    }
    .icon { width: 48px; height: 48px; color: #1DB954; margin: 0 auto var(--space-4); display: block; }
    h1 {
      font-family: var(--font-heading);
      font-size: var(--font-size-xl);
      margin: 0 0 var(--space-2);
      color: var(--color-fg);
    }
    p { color: var(--color-fg-muted); font-size: var(--font-size-sm); margin: 0 0 var(--space-4); line-height: 1.5; }
    .spin {
      width: 24px;
      height: 24px;
      margin: 0 auto;
      border: 2px solid var(--color-border-strong);
      border-top-color: #1DB954;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: var(--color-destructive); }
    a {
      color: #1DB954;
      text-decoration: none;
      font-family: var(--font-heading);
      font-size: var(--font-size-sm);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
</head>
<body>
  <div class="card" role="status" aria-live="polite">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm5.5 17.3a.75.75 0 0 1-1 .25c-2.7-1.6-6.1-2-10.1-1.1a.75.75 0 1 1-.3-1.5c4.4-1 8.2-.6 11.2 1.3.4.2.5.6.2 1Zm1.5-3.4a.94.94 0 0 1-1.3.3c-3.1-1.9-7.8-2.4-11.4-1.3a.94.94 0 1 1-.6-1.8c4.2-1.3 9.4-.7 13 1.5.4.3.5.9.3 1.3Zm.1-3.6c-3.7-2.2-9.8-2.4-13.3-1.3a1.13 1.13 0 1 1-.7-2.2c4-1.2 10.8-1 15 1.5.5.3.7 1 .4 1.5-.3.5-1 .7-1.4.5Z"/></svg>
    <h1 id="title">Connecting Spotify…</h1>
    <p id="body">Hang tight — we're finishing the handshake.</p>
    <div class="spin" id="spinner" aria-hidden="true"></div>
  </div>

  <script>
    // Exchange the auth code for tokens using the PKCE code_verifier the
    // launching page stashed in localStorage. No client_secret required;
    // the verifier proves possession of the original auth request.
    //
    // On success: store tokens (spotify_*), redirect back to the URL the
    // user came from. On error: show an inline message + a "go home" link.

    const KEY = {
      access: 'spotify_access_token',
      refresh: 'spotify_refresh_token',
      expiresAt: 'spotify_expires_at',
      verifier: 'spotify_code_verifier',
      state: 'spotify_oauth_state',
      returnTo: 'spotify_return_to',
    };

    const title = document.getElementById('title');
    const body = document.getElementById('body');
    const spinner = document.getElementById('spinner');

    function fail(message) {
      title.textContent = 'Spotify connection failed';
      title.classList.add('err');
      body.textContent = message;
      spinner.style.display = 'none';
      const back = document.createElement('div');
      back.style.marginTop = '16px';
      back.innerHTML = '<a href="/pages/main.html">Back to GeoGuesser</a>';
      document.querySelector('.card').appendChild(back);
    }

    (async function () {
      const params = new URLSearchParams(window.location.search);
      const err = params.get('error');
      const code = params.get('code');
      const returnedState = params.get('state');

      if (err) return fail(`Spotify returned an error: ${err}.`);
      if (!code) return fail('No authorisation code in the URL.');

      const verifier = localStorage.getItem(KEY.verifier);
      const expectedState = localStorage.getItem(KEY.state);
      if (!verifier || !expectedState) return fail('Login session expired — please try again.');
      if (returnedState !== expectedState) return fail('State mismatch — possible tampering. Aborted.');

      // Fetch the public client_id from the same backend the rest of the
      // page uses. (Cheaper than re-injecting it via querystring.)
      let clientId;
      try {
        const r = await fetch('/api/spotify/config', { credentials: 'same-origin' });
        const j = await r.json();
        if (!j.enabled) return fail('Spotify integration is disabled on this server.');
        clientId = j.clientId;
      } catch {
        return fail('Could not reach the server to finish connecting.');
      }

      const redirectUri = `${window.location.origin}/pages/spotify-callback.html`;
      const tokenBody = new URLSearchParams({
        grant_type: 'authorization_code',
        code,
        redirect_uri: redirectUri,
        client_id: clientId,
        code_verifier: verifier,
      });

      let data;
      try {
        const r = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: tokenBody,
        });
        if (!r.ok) {
          const txt = await r.text();
          return fail(`Token exchange failed (${r.status}). ${txt.slice(0, 120)}`);
        }
        data = await r.json();
      } catch (e) {
        return fail(`Network error during token exchange: ${e.message}`);
      }

      localStorage.setItem(KEY.access, data.access_token);
      if (data.refresh_token) localStorage.setItem(KEY.refresh, data.refresh_token);
      localStorage.setItem(KEY.expiresAt, String(Date.now() + (data.expires_in || 3600) * 1000));
      localStorage.removeItem(KEY.verifier);
      localStorage.removeItem(KEY.state);

      const returnTo = localStorage.getItem(KEY.returnTo);
      localStorage.removeItem(KEY.returnTo);

      title.textContent = 'Connected';
      body.textContent = 'Taking you back to the game…';

      // Only redirect to same-origin URLs to avoid being a redirect-laundering tool.
      let dest = '/pages/main.html';
      if (returnTo) {
        try {
          const u = new URL(returnTo, window.location.origin);
          if (u.origin === window.location.origin) dest = u.pathname + u.search + u.hash;
        } catch {}
      }
      setTimeout(() => { window.location.replace(dest); }, 400);
    })();
  </script>
</body>
</html>
