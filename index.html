<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./imgs/globe.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Login Page</title>
  <link rel="stylesheet" href="./styles/stylesLanding.css">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>
  <div id="top-right-container">
    <button id="loginStatus">Guest Mode</button>
  </div>
  <div class="blurry-background"></div>
  <div class="landing-page">
    <!-- Welcome Title -->
    <h1>Welcome to GeoGuesser!</h1>
    <h2>Login / Sign up</h2>

    <div>
        <input type="email" id="username-input" placeholder="Enter Email">
        <input type="password" id="password-input" placeholder="Enter Password">
    </div>
    <!-- Join Buttons -->
    <div class="start-button">
      <button id="login">Login</button>
    </div>

    <div id="signUp-container" class="start-button">
      <button id="signUp-button">Sign Up</button>
    </div>

  <script type="module" src="./scripts/login.js"></script>
</body>
</html>
