<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="../styles/stylesLanding.css">
</head>
<body class="bg-gray-100 flex min-h-screen">
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script type="module" src="../scripts/profile.js" defer></script>

    <div class="bg-white p-6 shadow-lg w-1/3 min-h-screen">
        <a href="./main.html" id="back-button">&lt; Back</a>
        <h2 id="profileTitle" class="text-xl font-semibold mb-4">Profile Settings</h2>
        
    <!-- <form class="space-y-4"> -->
        <div>
            <label class="block text-sm font-medium text-gray-700">New Email</label>
            <input type="text" id="email" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
            <input type="password" id="confirm_password_email" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
        </div>
        
        <button id="email-change-btn" type="submit" class="w-full bg-green-500 text-white p-2 rounded-md">Confirm Email Change</button>


        <div>
            <label class="block text-sm font-medium text-gray-700">New Password</label>
            <input type="text" id="new_password" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Confirm Old Password</label>
            <input type="password" id="confirm_password" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
        </div>
        
        <button id="password-change-btn" type="submit" class="w-full bg-red-500 text-white p-2 rounded-md">Confirm Password Change</button>

        <div>
            <label class="block text-sm font-medium text-gray-700">New Username</label>
            <input type="text" id="username" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
            <input type="password" id="confirm_password_username" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
        </div>
        
        <button id="username-change-btn" type="submit" class="w-full bg-green-500 text-white p-2 rounded-md">Confirm Username Change</button>

    </div>

    <!-- Stats Section -->
    <div class="flex-1 p-6">
        <h3 class="text-lg font-semibold mb-4">Your Stats</h3>
        <div id="map" class="bg-gray-200 p-4 rounded-md w-full h-[500px]"></div>
        <div id="country-stats" class="hidden bg-gray-200 p-4 rounded-md mt-4">
            <button onclick="showWorldMap()" class="mb-2 bg-blue-500 text-white p-2 rounded-md">Close</button>
            <div id="country-details"></div>
        </div>
    </div>
</body>
</html>
