<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="../../imgs/globe.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catan — Lobby</title>
  <link rel="stylesheet" href="../../styles/catan-tokens.css">
  <link rel="stylesheet" href="../../styles/catan.css">
  <link rel="stylesheet" href="../../styles/catan-lobby.css">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <!-- Google tag (gtag.js) — production analytics. Harmless on localhost. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DHZBWJCCDC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DHZBWJCCDC');
  </script>
</head>
<body class="catan">
  <header class="catan-topbar">
    <a class="catan-brand" href="./home.html">← Catan</a>
    <div class="turn-banner"></div>
  </header>

  <main class="catan-center">
    <div class="catan-card" id="lobby-card">
      <div class="room-code-banner">
        <span class="room-code-label">Room code — share to invite</span>
        <button class="room-code-value" id="room-code-copy" title="Click to copy">
          <span id="room-code-text">·····</span>
          <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M16 1H4a2 2 0 0 0-2 2v12h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/>
          </svg>
        </button>
        <span class="copy-feedback" id="copy-feedback" aria-live="polite"></span>
      </div>

      <h2>Get ready</h2>
      <div class="details-row">
        <input type="text" id="name-input" placeholder="Your name" maxlength="20" autocomplete="off">
        <input type="color" id="colour-input" value="#D64545" title="Your colour">
      </div>
      <button class="catan-btn primary" id="ready-btn">Ready ✓</button>
      <p class="form-error" id="error-message"></p>

      <div class="map-section">
        <div class="map-row" id="map-row">
          <button class="map-pill" data-map="classic">Classic</button>
          <button class="map-pill" data-map="beginner">Beginner</button>
          <button class="map-pill" data-map="ring">Ring</button>
          <button class="map-pill" data-map="random">Random</button>
        </div>
        <div class="map-preview">
          <svg id="map-preview-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <p class="map-hint" id="map-hint"></p>
      </div>

      <div class="timer-section">
        <span class="timer-label">Turn timer</span>
        <div class="timer-row" id="timer-row">
          <button class="map-pill" data-sec="0">Off</button>
          <button class="map-pill" data-sec="30">30s</button>
          <button class="map-pill" data-sec="60">60s</button>
          <button class="map-pill" data-sec="90">90s</button>
        </div>
      </div>

      <p class="lobby-hint">Share the room code — the game needs <b>2–4 players</b>, all ready.</p>
      <div id="roster"></div>
      <button class="catan-btn ok big" id="start-btn" disabled>Start Game</button>
      <p class="form-error" id="lobby-error"></p>
    </div>
  </main>

  <script type="module" src="../../scripts/catan/lobby.js"></script>
</body>
</html>
