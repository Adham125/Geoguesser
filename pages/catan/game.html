<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="../../imgs/globe.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catan</title>
  <link rel="stylesheet" href="../../styles/catan-tokens.css">
  <link rel="stylesheet" href="../../styles/catan.css">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <!-- Google tag (gtag.js) — production analytics. Harmless on localhost. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DHZBWJCCDC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DHZBWJCCDC');
  </script>
</head>
<body class="catan">
  <header class="catan-topbar">
    <a class="catan-brand" href="./home.html">CATAN</a>
    <div class="turn-banner" id="turn-banner"></div>
    <div class="room-chip" id="room-chip"></div>
  </header>

  <main class="catan-table">
    <div class="board-wrap">
      <div class="status-strip" id="status-strip"></div>
      <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <aside class="catan-side">
      <div id="players"></div>
      <div class="dice-area">
        <div class="die" id="die-1"></div>
        <div class="die" id="die-2"></div>
        <button class="catan-btn primary" id="roll-btn" disabled>Roll</button>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
    </aside>
  </main>

  <footer class="catan-dock">
    <div class="hand" id="hand"></div>
    <div class="actions">
      <button class="catan-btn" id="build-road" disabled>Road <span class="btn-cost">🪵🧱</span></button>
      <button class="catan-btn" id="build-settlement" disabled>Settlement <span class="btn-cost">🪵🧱🐑🌾</span></button>
      <button class="catan-btn" id="build-city" disabled>City <span class="btn-cost">🌾🌾🪨🪨🪨</span></button>
      <button class="catan-btn" id="trade-btn" disabled>Trade 4:1</button>
      <button class="catan-btn ok" id="end-turn" disabled>End Turn</button>
    </div>
  </footer>

  <div class="catan-modal-backdrop" id="discard-modal" hidden>
    <div class="catan-modal">
      <h2>Discard cards</h2>
      <p id="discard-prompt"></p>
      <div class="picker-row" id="discard-picker"></div>
      <button class="catan-btn primary" id="discard-confirm" disabled>Discard</button>
    </div>
  </div>

  <div class="catan-modal-backdrop" id="trade-modal" hidden>
    <div class="catan-modal">
      <h2>Bank trade 4 : 1</h2>
      <p>Give four of a kind, receive one of your choice.</p>
      <div class="picker-row" id="trade-give"></div>
      <div class="picker-row" id="trade-receive"></div>
      <div>
        <button class="catan-btn" id="trade-cancel">Cancel</button>
        <button class="catan-btn primary" id="trade-confirm" disabled>Trade</button>
      </div>
    </div>
  </div>

  <div class="catan-modal-backdrop" id="steal-modal" hidden>
    <div class="catan-modal">
      <h2>Steal from…</h2>
      <div class="picker-row" id="steal-options"></div>
    </div>
  </div>

  <div class="catan-modal-backdrop" id="winner-modal" hidden>
    <div class="catan-modal winner-overlay">
      <h2 id="winner-title"></h2>
      <p id="winner-sub"></p>
      <a class="catan-btn primary" href="./home.html">Back to Catan home</a>
    </div>
  </div>

  <script type="module" src="../../scripts/catan/game.js"></script>
</body>
</html>
